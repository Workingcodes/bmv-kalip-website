name: Download Images & Video from CDN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create directories
        run: mkdir -p img/galeri img/hero

      - name: Download logo (Instagram profile picture)
        run: |
          curl -L --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0" \
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.2885-19/429811262_758640186190524_2835556405324053241_n.jpg?stp=dst-jpg_s320x320_tt6&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=100&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=Or0-G6vEWTgQ7kNvwFxMGDF&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af-gBvWeNA1poSHhbdd-rYH_eL29YHFQwX3KLcCG3-v9Dw&oe=6A2A65B3&_nc_sid=8b3546" \
            -o img/logo.jpg || true
          if file img/logo.jpg | grep -qiE 'JPEG|image'; then
            echo "Logo OK ($(wc -c < img/logo.jpg) bytes)"
          else
            echo "Logo INVALID - removing"; rm -f img/logo.jpg
          fi

      - name: Download gallery images
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0"
          declare -a URLS=(
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503233670_1911864652959293_4441883173083678777_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=105&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=V0oMBP12l10Q7kNvwH8NupU&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af8AzpjYgrqN-Cf9qVegNC-QT_o6IhpvicBRQ1vlqNt1tA&oe=6A2A6C90&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503307044_1052929200266067_7482918011485116918_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=103&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=o9KvLZCi_n8Q7kNvwH2tGWR&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af-No93SbH1mq9U0c43NS4bLIhJCQvYDe1G5r0yTEqnHZQ&oe=6A2A694A&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/502632037_661765870194933_1492943859974980600_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=109&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=LNGDdors8GsQ7kNvwFqeoCG&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af8-U4CoNDomFnTe8eHX91lUq0erhT6dwBv7-SG97h3yeA&oe=6A2A7D92&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503890680_705967168468639_3053481746997252201_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=107&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=TFgMISEW1nUQ7kNvwHlUrR3&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af-R_c9WF55rFCUdyZjr_CyZWN9n_Jm06vuDs2e-zYayQQ&oe=6A2A74F2&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503834525_677637435110288_4004380162609741547_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=108&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=l9At7ENmbI8Q7kNvwGZ6L6v&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af8UGzvWEWcm3k6ssD9_35kk9HTgnR7VR-bGnfaUMYZSkg&oe=6A2A8823&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/502130369_702941138790192_8439654055507365185_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=100&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=oEAHVaqh9C0Q7kNvwHlYI7t&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af87zBx1FIN2osLu7MSPorph3LO-w6LKn4izrLKDuK7wNg&oe=6A2A8B08&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/502644630_1323349295431901_3680044370381662696_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=105&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=4WDTQS85W0MQ7kNvwELdrag&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af_dH4buCMY0u_-skrHnRspdEmedhZfwGFbBVvoEteDmYg&oe=6A2A9449&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503361005_671743365749268_6960986480100536014_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=100&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=LcnGSySTJNoQ7kNvwHEbOKd&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af-xlz9Q1vDwE9nneWSFgluB5yl0isULAtIXzyRU_tGtdA&oe=6A2A70EB&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503763307_682589871337029_1745215531231145122_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=109&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=XiQ1--bH2lgQ7kNvwF_iFN6&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af8LlgBL6V3j1CE4NrZEG8U2uUFZTdEKCefpiU7Mkz_HHQ&oe=6A2A6676&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503275035_1462303571781225_4213733327126763396_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=109&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=kS6sPdWOtr0Q7kNvwEK4-3W&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af8VodxCJVE-4m9XpjoAGex_wUSAEWR6xoK7GrAgVRhWQg&oe=6A2A8EAA&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/501191432_1761642194564452_1968819030304975287_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=104&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=qgUiNBiUMXgQ7kNvwGxrxkt&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af-XxMbdou3pRA-5gEvFCHlxKkJL-zraUBG35oH2cRWydg&oe=6A2A86B5&_nc_sid=8b3546"
            "https://scontent-xxc1-1.cdninstagram.com/v/t51.71878-15/503664235_1060640912617469_6254902812068845246_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-xxc1-1.cdninstagram.com&_nc_cat=105&_nc_oc=Q6cZ2gGHhRJJ5O4iW9f_hFiT78lHCkP7t5dJyBEP8yR05nTx_Slqn1DviWoF57T4V-C326g&_nc_ohc=J31HQSqXEe0Q7kNvwGsWMOV&_nc_gid=dx9BL_HATKYGqZivbudNvA&edm=AOQ1c0wBAAAA&ccb=7-5&oh=00_Af9ViAuQ7Fi0pnLGIC03NnNkaP_Rum1gs6xTvzUEd0zqKg&oe=6A2A8215&_nc_sid=8b3546"
          )
          for i in "${!URLS[@]}"; do
            num=$((i+1))
            curl -L --max-time 30 -A "$UA" "${URLS[$i]}" -o "img/galeri/ig_${num}.jpg" || true
            if file "img/galeri/ig_${num}.jpg" | grep -qiE 'JPEG|image'; then
              echo "img $num OK ($(wc -c < img/galeri/ig_${num}.jpg) bytes)"
            else
              echo "img $num INVALID - removing"
              rm -f "img/galeri/ig_${num}.jpg"
            fi
          done

      - name: Download and compress hero video
        continue-on-error: true
        run: |
          sudo apt-get install -y ffmpeg 2>/dev/null || true
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0"
          curl -L --max-time 120 --max-filesize 80000000 -A "$UA" \
            "https://videos.pexels.com/video-files/27857021/12245078_3840_2160_60fps.mp4" \
            -o img/hero/hero_raw.mp4 || true
          if [ -s img/hero/hero_raw.mp4 ] && file img/hero/hero_raw.mp4 | grep -qiE 'MP4|video|ISO'; then
            ffmpeg -i img/hero/hero_raw.mp4 -t 10 -vf "scale=1280:720" \
              -c:v libx264 -crf 28 -preset fast -an -movflags +faststart \
              img/hero/hero.mp4 && echo "Video compressed OK" || echo "ffmpeg failed"
          else
            echo "No valid video - CSS fallback will be used"
          fi
          rm -f img/hero/hero_raw.mp4

      - name: List downloaded files
        run: |
          echo "=== img/ ===" && ls -lh img/ 2>/dev/null || echo "(empty)"
          echo "=== img/galeri/ ===" && ls -lh img/galeri/ 2>/dev/null || echo "(empty)"
          echo "=== img/hero/ ===" && ls -lh img/hero/ 2>/dev/null || echo "(empty)"

      - name: Commit and push
        run: |
          git config user.email "nakosat@gmail.com"
          git config user.name "Workingcodes"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Workingcodes/bmv-kalip-website.git"
          git add img/
          git status
          if ! git diff --staged --quiet; then
            git commit -m "Add downloaded images, logo and hero video"
            git push origin main
            echo "PUSHED OK"
          else
            echo "Nothing to commit - no valid files downloaded"
          fi
